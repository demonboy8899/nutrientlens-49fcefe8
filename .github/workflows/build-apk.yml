name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create placeholder web shell
        run: |
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <title>NutrientLens</title>
              <style>
                html,body{margin:0;height:100%;background:#0A1128;color:#E6EDF7;
                  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
                  display:flex;align-items:center;justify-content:center}
                p{opacity:.7;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
              </style>
            </head>
            <body>
              <p>Loading NutrientLens…</p>
            </body>
          </html>
          HTML

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.nutrientlens.app",
            "appName": "NutrientLens",
            "webDir": "www",
            "server": {
              "url": "https://nutrient-lens-core--demonboy401.replit.app",
              "androidScheme": "https",
              "cleartext": false
            }
          }
          JSON

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrientlens-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error