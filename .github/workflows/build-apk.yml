name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create minimal web placeholder
        run: mkdir -p www && echo "<html><body>Loading...</body></html>" > www/index.html

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.nutrientlens.app",
            "appName": "NutrientLens",
            "webDir": "www",
            "server": {
              "url": "https://nutrientlens.lovable.app",
              "androidScheme": "https",
              "cleartext": false
            }
          }
          EOF

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrientlens-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
