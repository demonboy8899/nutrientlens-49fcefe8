name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build
      - name: Debug build output
        run: |
          echo "=== Top-level after build ==="
          ls -la
          echo "=== Searching for index.html ==="
          find . -maxdepth 4 -name "index.html" -not -path "*/node_modules/*"
          echo "=== .output tree (if it exists) ==="
          find .output -maxdepth 4 2>/dev/null || echo "(no .output directory)"

      - name: Set up Node.js (for npx/Capacitor tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android platform
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrientlens-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
